# Pipeline definitions
# These are passed into the data object as global attributes, making them accessible from all steps
pipeline:
 # [name]: "Short string name"
 #   A name for the pipeline, helpful to distinguish specific tasks
 name: "Data Processing Pipeline"
 # [description]: "Longer string describing describing pipeline purpse"
 description: "A pipeline for processing and analyzing multi-dimensional data"
 # [out_directory]: string or path
 #   Output directory for any generated files (logs, reports, figures, etc.)
 out_directory: ./examples/data/
 # [log_file]: string name for the log file
 #   The name intended for the log file, helpful if running different pipelines and tracking performance.
 #   Default behavior overwrites the previous log file.
 #   Console logging is always on. If log_file is not set (or set to None/null), no log file is written.
 log_file: last_run.log

# All step configs
# The general structure of a step follows:
#
# - name:
#   parameters:
#     ...
#   diagnostics:
#
# Parameters is used to specify user inputs that are required to run the step
# If diagnostics is true, the majority of steps will ouput a basic plot

steps:
# ------------------------------------------------------------------------------------------- Importing/Generating data -------------------------------------------------------------------------------------------

# Generate Data (src/pelagos_py/steps/input_output/gen_data.py):
#   Generates random data for pipeline input. Typically used for testing
  - name: "Generate Data"
    parameters:
      # [sampling info]:
      #   [start_date (y-m-d), end_date (y-m-d), sample_period (s)]
      sampling_info: ["2025-01-01", "2025-01-02", 20]
      # [additional_variables]:
      #   By default, TIME, GPS and raw CTD data are generated ("LATITUDE", "LONGITUDE", "PRES", "TEMP", "CNDC")
      #   Variables listed in "additional_variables" will be added to the defaults
      additional_variables: ["DENSITY", "ABS_SALINITY"]
      # [value_limits]:
      #   Random sampling range for specified variables
      value_limits:
        "DENSITY": [1028, 1032]
    # [diagnostics]:
    #   No diagnostic output defined
    diagnostics: false

# Load OG1 (src/pelagos_py/steps/input_output/load_data.py):
#   Loads netCDF (*.nc) data files into the pipeline
  - name: "Load OG1"
    parameters:
      # [file_path]:
      #   Path to the input NetCDF file
      file_path: "../examples/data/OG1/Cabot_645.nc"
      # [filter_bad_time]:
      #   Remove data outside of the expected time window, demarcated in data_start and _end.
      filter_bad_time: false
      # [data_start]:
      #   Minimum valid timestamp for trimming. Keep blank to default to "DEPLOYMENT_TIME"
      data_start: "2023-05-01T00:00:00"
      # [data_end]:
      #   Maximum valid timestamp for trimming. Keep blank to default to the time the pipeline is run.
      data_end: "2024-05-01T00:00:00"
    # [diagnostics]:
    #   Prints a summary of dataset variables and attributes
    diagnostics: false

# Correct Values (src/pelagos_py/steps/input_output/correct_values.py):
#   Applies an affine correction (corrected = slope * value + intercept) to a single variable.
#   Useful for unit conversions (e.g. CNDC S/m -> mS/cm is a simple x10) or sensor alignment.
#   The shown config converts CNDC into the mS/cm expected by Derive CTD's GSW salinity calc.
  - name: "Correct Values"
    parameters:
      # [target_variable]:
      #   Name of the variable to correct.
      target_variable: CNDC
      # [slope]:
      #   Multiplicative factor (corrected = slope * value + intercept). x10 for the S/m -> mS/cm conversion.
      slope: 10.0
      # [intercept]:
      #   Additive offset applied after scaling. Use for sensor alignment; leave 0 for a pure unit conversion.
      intercept: 0.0
      # [expected_range]:
      #   Optional [min, max] for the corrected variable. The correction is applied only when the data's
      #   median falls OUTSIDE this range, so files already in the right units are left untouched.
      #   Omit to always apply the correction.
      expected_range: [20, 45]
      # [corrected_units]:
      #   Optional units string written to the variable's attributes after a correction. Leave blank to
      #   keep the existing units.
      corrected_units: mS/cm
    # [diagnostics]:
    #   Plots the raw vs corrected values with the expected-range limits.
    diagnostics: false

# -------------------------------------------------------------------------------------------Prelim data check ------------------------------------------------------------------------------------------------
# Format Checker (src/pelagos_py/steps/input_output/format_check.py)
#   Runs data format checker for different netCDF/glider standards and saves results to file.
#   Typically preceeds any data loading/manipulation.
#   Exports to `out_directory` as specified in pipeline parameters.
  - name: Format Checker
    parameters:
      # [src]:
      #   Source file path for testing.
      src: "../examples/data/OG1/Cabot_645.nc"
      # [standards]:
      #   List of string entries for different formats to check.
      standards: ['cf','og']
      # [output_type]:
      #   A short pass/fail summary is ALWAYS printed to the console. To also save a
      #   detailed report file, set this to 'json' (high detail), 'rst' (ASCII), or a
      #   list of both. Omit for console only. Saving requires out_directory.
      output_type: ['json', 'rst']
      # [proceed_on_fail]:
      #   Whether or not to allow the pipeline to continue if the dataset doesn't pass selected standards.
      proceed_on_fail: true

# ------------------------------------------------------------------------------------------- Exporting data -------------------------------------------------------------------------------------------

# Data Export (src/pelagos_py/steps/input_output/export.py):
# Saves the current xarray dataset stored in pipeline._context["data"]
  - name: "Data Export"
    parameters:
      # [export_format]:
      #   netCDF export format compatible with xarray.to_netcdf
      export_format: netcdf
      # [output_path]:
      #   path to the file where the dataset will be exported to
      output_path: "../examples/data/OG1/Nelson_646_R_Processed.nc"


# ------------------------------------------------------------------------------------------- Quality Control ---------------------------------------------------------------------------------------------------

# All QC tests are called through the "Apply QC" step with individual test settings nested in its config.
# This updates the QC columns (<var>_QC) of the data depending on the test output. If Apply QC is called
# then qc_history will be added to the pipeline context which tracks which variables have been tested by
# which tests. Apply QC can be called multiple times, so any test can be run multiple times at different
# stages in the processing. All QC test src can be found in: * = src/pelagos_py/steps/quality_control

# Apply QC (src/pelagos_py/steps/quality_control/apply_qc.py)
# Applies the specified tests to data using the Argo flag naming conventions.
  - name: "Apply QC"
    parameters:
      # [qc_settings]:
      #   test name: settings pairs. The order of application runs top-down.
      qc_settings:
        # impossible date test (*/impossible_date_test.py):
        #   Flag: 4 (bad)
        #   Checks that the TIME variable has values between 1985 and now.
        impossible date qc: {}

        # impossible location test (*/impossible_location_test.py):
        #   Flag: 4 (bad)
        #   Check that LATITUDE and LONGITUDE are between (-90, 90) and (-180, 180) degress respectively.
        impossible location qc: {}

        # position on land test (*/position_on_land_test.py):
        #   Flag: 4 (bad)
        #   Checks if the GPS coords are on land.
        position on land qc: {}

        # impossible speed test (*/impossible_speed_test.py):
        #   Flag: 4 (bad)
        #   Checks if the horizontal speed derived from LATITUDE, LONGITUDE and TIME is valid.
        impossible speed qc: {}

        # range test (*/range_qc.py):
        #   Flag: User-specified
        #   Flags values by range, per variable. Each band carries an inside/outside keyword:
        #   [low, high, "outside"] is a band of GOOD values (data outside it is flagged);
        #   [low, high, "inside"] is an IMPOSSIBLE band (data within it is flagged). A flag may
        #   list several bands, e.g. 4: [[2, 3, inside], [0.1, 10, outside]]. If the keyword is
        #   omitted, bound order is the fallback (ascending -> outside, descending -> inside).
        #   A single scalar instead of a pair flags exact matches (handy for fill values).
        #   Replaces the old separate 'gross range' (outside) and 'impossible range' (inside) tests.
        #   The results from one variable can be propagated onto other variables using "also_flag".
        #   This test can also be limited to specific depth ranges if DEPTH is in the dataset vars.
        range qc:
          # [variable_ranges]:
          #   variable: {flag: band} pairs. Multiple variables can be specified.
          #   Here PRES uses 'inside', so PRES is flagged when it lies WITHIN the band.
          variable_ranges:
            PRES:
              3: [-2.4, -5, inside]
              4: [-5, -.inf, inside]
          # [also_flag]:
          #   Alows the QC result from one variable to be applied to others. eg. Often if PRES fails a
          #   range test, it is assumed that all CTD variables are no longer trustworthy.
          #   Flags are merged onto companions (Argo matrix) so the worst flag wins.
          also_flag:
            PRES: [CNDC, TEMP]
          # [flag_instead]:
          #   As also_flag, but the source variable's own flags are NOT written - it is tested only
          #   to flag its companions. eg. to flag CHLA by DEPTH (bad in the top 5m, good below)
          #   without flagging DEPTH itself:
          #     variable_ranges: {DEPTH: {3: [0, 5, inside], 2: [0, 5, outside]}}
          #     flag_instead: {DEPTH: [CHLA]}
          # [diagnostics]:
          #   When the Apply QC step has diagnostics enabled, every flagged variable is plotted
          #   coloured by flag number (no separate 'plot' parameter is needed).

        # stuck value test (*/stuck_value_test.py):
        #   Flag: 4 (bad)
        #   Checks for stuck values defined by N repeats of the same value.
        stuck value qc:
          # [variables]:
          #   {variable: N} pairs with N being the number of repeats of a value to make it stuck
          variables:
            PRES: 2
          # [also_flag]:
          #   Alows the QC result from one variable to be applied to others.
          also_flag:
            PRES: [CNDC, TEMP]
          # [plot]:
          #   Plots data coloured by flag for the variables listed.
          plot: [PRES]

        # spike test (*/spike_test.py):
        #   Flag: 4 (bad)
        #   Checks for spiking using deviation from the local median of specified variables.
        spike qc:
          # [variables]:
          #   {variable: N} specifying which variables to apply the test to and the outlier threshold multiplier
          #   N, values are flagged if their values exceed (locally) median +- N * standard deviation.
          variables:
            PRES: 2
            LATITUDE: 1
          # [window_size]:
          #   The window size for the running median and standard deviation caluclations
          window_size: 10
          # [also_flag]:
          #   Alows the QC result from one variable to be applied to others.
          also_flag:
            PRES: [CNDC, TEMP]
            LATITUDE: [LONGITUDE]
          # [plot]:
          #   Plots data coloured by flag for the variables listed.
          plot: [PRES, LATITUDE]

        # valid_profile_test (*/valid_profile_test.py):
        #   Flag: 4 (bad), 3 (probably bad)
        #   Checks if profiles have at least N datapoints and contain data in a specific depth range
        valid profile qc:
          # [profile_length]:
          #   Number of datapoints per profile below which the entire profile will be flagged 4
          profile_length: 1000
          # [depth_range]:
          #   DEPTH range that a profile must have at least one point in, otherwise it is flagged 3
          depth_range: [0, .inf]

        # flag_full_profile (*/flag_full_profile.py):
        #   Flag: 4 (bad)
        #   flags a whole profile if a user-specified limit of bad (4) flags are found.
        flag full profile:
          # [check_vars]:
          #   {variable: N} pairs where if >N bad values are found, the whole profile is flagged
          check_vars:
            PRES: 10
            CHLA: 20

        # NOTE: "PAR irregularity qc" requires PROFILE_NUMBER and so must run *after*
        # "Find Profiles". It is therefore applied in a second "Apply QC" step further
        # down this file (see the Profile Finding section) rather than here.
    # [diagnostics]:
    #   If diagnostics is true, every specified test in this Apply QC call will generate plots
    diagnostics: false


# ------------------------------------------------------------------------------------ Filtering & Interpolation ------------------------------------------------------------------------------------------

# Processing steps (not yet formally defined) can filter data inputs by QC flag before it is used in processing.
# This functionality is inherited from QCHandlingMixin (src/pelagos_py/utils/qc_handling.py). By default, the QC
# filter does not look for any flags, however this can be changed through the optional inclusion of
# qc_handling_settings to the step config - see below.

# QC Handling (src/pelagos_py/utils/qc_handling.py):
# Allows the user to filter the data before processing steps
  - name: "" # Any step that inherits from QCHandlingMixin
    parameters:
      # [qc_handling_settings]:
      #   Can be specified in any step that has the QC filtering functionality
      qc_handling_settings:
        # [flag_filter_settings]:
        #   {variable: flags to filter} pairs. Data that is flagged with any of the specified flags is replaced
        #   with a nan internally. All steps are designed to operate with nans.
        flag_filter_settings:
          PRES: [3, 4]
        # [reconstruction_behaviour]:
        #   Specifies how the data will be reconstructed after processing has occured. There are two options (defaults to reinsert):
        #   "replace":  Indices where data was filtered retain their post-processing value and the original "bad data" is deleted.
        #   "reinsert": The filtered "bad data" is reinserted back into the post-processed data.
        reconstruction_behaviour: "replace"
        # [flag_mapping]:
        #   Tells the QC handler how flags should change for "bad data" indices if the pre- & postprocessing data are different.
        #   Eg. Interpolation would replace bad and missing values (3, 4, 9) with interpolated values (8).
        flag_mapping:
          3: 8
          4: 8
          9: 8
        # [calculation_flag_filter]:
        #   Flags that a step's calculations ignore (defaults to [3, 4, 9]). Unlike flag_filter_settings this does
        #   not remove the data: the samples are still corrected, they just don't inform the correction. Eg. Deep
        #   Correction leaves bad values out of the dark value estimate but still subtracts the dark value from
        #   them, and CHLA Quenching won't use them to find the quenching depth. Set to [] to opt out.
        #   Used by: Deep Correction, Mixed Layer Depth, CHLA Quenching.
        calculation_flag_filter: [3, 4, 9]

# Interpolate Data (src/pelagos_py/steps/processing/interpolate_data.py):
# Interpolates over nan values. Paired with QC handling allowing "bad data" to be replaced with nans and interpolated over.
  - name: "Interpolate Data"
    parameters:
      qc_handling_settings:
        flag_filter_settings:
          PRES: [3, 4, 9]
          LATITUDE: [3, 4, 9]
          LONGITUDE: [3, 4, 9]
        reconstruction_behaviour: "replace"
        flag_mapping:
          3: 8
          4: 8
          9: 8
    # [diagnostics]:
    #   Creates two comparison plots of before & after interpolation
    diagnostics: false


# ------------------------------------------------------------------------------------------- Profile Finding -------------------------------------------------------------------------------------------

# Find Profiles (src/pelagos_py/steps/processing/find_profiles.py):
# Classifies each measurement into an OG1 scientific phase (SCI_PHASE) and derives
# PROFILE_NUMBER, PROFILE_DIRECTION, PROFILE_GRADIENT and CYCLE. All parameters are
# optional — the defaults shown below work out of the box, so `- name: "Find Profiles"`
# on its own is a valid step.
  - name: "Find Profiles"
    parameters:
      # [depth_column]:
      #   Depth or pressure column used for the analysis.
      depth_column: PRES
      # [time_window_seconds]:
      #   Time window (seconds) used for resampling and smoothing of depth/velocity/acceleration.
      time_window_seconds: 30
      # [is_propelled]:
      #   Target phase for near-horizontal transects: true -> propelled (6), false -> parking (4),
      #   or "auto" to decide from the dataset `id` attribute ("ALR" -> propelled, else parking).
      is_propelled: "auto"
      # [velocity_threshold]:
      #   Vertical velocity (m/s) above which a sample is flagged as ascent/descent.
      velocity_threshold: 0.033
      # [acceleration_threshold]:
      #   Maximum absolute acceleration for a sample to count as a stable horizontal (transect) phase.
      acceleration_threshold: 0.0005
      # [transition_buffer_seconds]:
      #   Buffer (seconds) trimmed from each end of a continuous ascent/descent/transect block.
      transition_buffer_seconds: 30
      # [min_duration_minutes]:
      #   Minimum duration (minutes) for a phase block to be kept.
      min_duration_minutes: 5
      # [peak_prominence]:
      #   Topographic prominence (depth units) a turning point must have to be flagged as an inflection.
      peak_prominence: 20
      # [min_samples_between_peaks]:
      #   Minimum number of bins required between detected inflection peaks.
      min_samples_between_peaks: 20
      # [gap_threshold_minutes]:
      #   A time gap longer than this (minutes) splits the record into disconnected chunks for inflection detection.
      gap_threshold_minutes: 5
      # [surface_depth]:
      #   Depth (depth units) below which data is treated as general surface operation when searching for inflections.
      surface_depth: 20
      # [surfacing_threshold]:
      #   Strict depth threshold below which inflection/transect points are reclassified as surfacing (phase 3).
      surfacing_threshold: 5
      # [parking_gradient_threshold]:
      #   Absolute depth gradient (m/s) above which a drifting parking/propelled block is converted back to ascent/descent.
      parking_gradient_threshold: 0.005
    # [diagnostics]:
    #   If true, plots a static two-panel figure: the phase classification (DEPTH-TIME
    #   coloured by SCI_PHASE) and the derived PROFILE_NUMBER / CYCLE numbering.
    diagnostics: false

# Apply QC (post-profile): tests that depend on PROFILE_NUMBER must run after "Find Profiles".
# "Apply QC" can be called any number of times, so profile-dependent tests live in this second call.
  - name: "Apply QC"
    parameters:
      qc_settings:
        # PAR irregularity test (*/par_irregularity_test.py):
        #   Flag: 4 (bad), 3 (probably bad)
        #   Flags each PAR measurement according to the statistical shape of the irradiance profile and
        #   solar elevation. Based on La Forgia & Organelli (2025, L&O Methods, 23:526–542).
        #   Requires PROFILE_NUMBER (from "Find Profiles"), which is why it runs here.
        PAR irregularity qc:
          # [noise_equivalent_estimate]:
          #   The PAR noise floor. If values are found below this they are flagged as probably bad (3).
          noise_equivalent_estimate: 3e-2
          # [plot_profiles]:
          #   List of profile numbers to be plotted
          plot_profiles: [100, 200]
    # [diagnostics]:
    #   If diagnostics is true, every specified test in this Apply QC call will generate plots
    diagnostics: false


# ------------------------------------------------------------------------------------------- CTD Processing -------------------------------------------------------------------------------------------

# CTD processing operates on variables output by the glider CTD (PRES, CNDC, TEMP).

# Derive CTD (src/pelagos_py/steps/processing/derive_ctd.py):
# Derives CTD variables using gsw-python (TEOS-10) from PRES, CNDC & TEMP
  - name: "Derive CTD"
    parameters:
      # [to_derive]:
      #   The user may specify a subset of the below variables to be derived and added to the dataset.
      to_derive: [
        DEPTH,
        PRAC_SALINITY,
        ABS_SALINITY,
        CONS_TEMP,
        DENSITY
      ]
    # [diagnostics]: None
    diagnostics: false

# Salinity Adjustment (src/pelagos_py/steps/processing/salinity.py -> AdjustSalinity):
# Applies the thermal-lag correction for Salinity presented in Morrison et al 1994. It is recomended that this be used with
# QC filtering as the data is used to optimize adjustment coefficients.
  - name: "Salinity Adjustment"
    parameters:
      # [filter_window_size]:
      #   Running average filter size used to smooth raw data when computing optimal time lags
      filter_window_size: 21
    # [diagnostics]:
    #   Generates a dashboard summarising the CT-lag and thermal-mass corrections applied
    diagnostics: false


# ------------------------------------------------------------------------------------------- Chl-a processing -------------------------------------------------------------------------------------------

# Note that the variables added to the dataset by these steps will appear as <input>_ADJUSTED unless
# <input> already has the _ADJUSTED suffix, in which case, the input will be modified inplace.

# Deep Correction (src/pelagos_py/steps/processing/deep_correction.py -> deep_correction):
# Subtracts a constant dark offset so that deep, signal-free values are zeroed.
  - name: "Deep Correction"
    parameters:
      # [apply_to]:
      #   Name of the variable to apply the correction to.
      apply_to: CHLA
      # [dark_value]:
      #   If null, the dark value will be detemined from the data, else it will use the specified value
      dark_value: null
      # [depth_var]:
      #   Vertical-coordinate variable used to find deep data (deeper = larger value).
      depth_var: PRES
      # [depth_threshold]:
      #   Only data where depth_var exceeds this is used to compute the dark value.
      depth_threshold: 950
      # [n_profiles]:
      #   Number of deep profiles (in order of occurrence) used to estimate the dark value.
      n_profiles: 5
      # [smoothing_window]:
      #   Rolling-median window (points) applied along each profile before sampling.
      smoothing_window: 5
      # [max_valid_value]:
      #   Deep values at or above this are ignored (guards against non-dark readings).
      max_valid_value: 5
      # [min_valid_points]:
      #   A profile must have at least this many valid deep points to contribute.
      min_valid_points: 3
    # [diagnostics]:
    #   Plot the deep profiles used and the deep values before/after correction.
    diagnostics: false

# CHLA Quenching (src/pelagos_py/steps/processing/chla_quenching.py -> chla_quenching_correction):
# Offers a selection of Non-photochemical quenching correction techniques for removing Chla signal
# supression caused by phytoplankton quenching.
  - name: "CHLA Quenching"
    parameters:
      # [method]:
      #   Method used for quenching correction. Implemented: 'xing2012' (MLD-based),
      #   'biermann2015' (euphotic-depth-based, needs PAR), 'xing2018'
      #   (backscatter-based, needs BBP + PAR + MLD; see 'hybrid'), 'hemsley2015'
      #   (global night fluorescence-bbp regression, needs BBP + PAR), 'thomalla2017'
      #   (per-night fl:bbp ratio profile, needs BBP + PAR), 'sackmann2008' (max
      #   fl:bbp ratio within the MLD, needs BBP + MLD) and 'swart2015' (max fl:bbp
      #   ratio within the euphotic zone, needs BBP + PAR).
      method: xing2012
      # [hybrid]:
      #   Only used when method is 'xing2018'. When true (the default), shallow-mixing
      #   profiles (iPAR=15 depth > MLD) use the Terrats et al. (2020) X18_S08 hybrid
      #   instead of Xing 2018; deep-mixing profiles use Xing 2018 either way. When
      #   false, Xing 2018 is applied to every profile.
      hybrid: true
      # [apply_to]:
      #   Name of the variable to apply the correction to.
      apply_to: CHLA
      # [bbp_var]:
      #   Backscatter variable used by the backscatter-based methods. Defaults to the
      #   despiked 'BBP700_BASELINE'; falls back through BBP700/BBP532 if absent.
      bbp_var: BBP700_BASELINE
      # [par_var]:
      #   Downwelling PAR variable used by the PAR-based methods.
      par_var: DOWNWELLING_PAR
      # [interpolate_par]:
      #   For PAR-based methods, fill casts lacking usable PAR from the nearest
      #   valid cast on each side so every cast can be corrected.
      interpolate_par: true
      # [interpolate_par_max_gap_hours]:
      #   Only used when interpolate_par is true: a cast is filled only if a
      #   valid-PAR cast exists within this many hours on at least one side.
      interpolate_par_max_gap_hours: 12.0
      # Note: the MLD-based methods ('xing2012'/'xing2018'/'sackmann2008')
      #   read the 'MLD' variable produced by a preceding 'Mixed Layer Depth' step;
      #   configure the MLD method and thresholds there, not here.
    diagnostics: false


# ------------------------------------------------------------------------------------------- Backscatter processing -------------------------------------------------------------------------------------------

# Note that the variables added to the dataset by these steps will appear as <input>_ADJUSTED unless
# <input> already has the _ADJUSTED suffix, in which case, the input will be modified inplace.

# BBP from Beta (src/pelagos_py/steps/processing/bbp.py -> BBPFromBeta):
# Converts from units of beta to BBP
  - name: "BBP from Beta"
    parameters:
      # [apply_to]:
      #   Name of the variable to apply the correction to.
      apply_to: BBP700
      # [output_as]:
      #   Name to use for the output data that is added to the dataset
      output_as: BBP700
      # [theta]:
      #   effective (centroid) optical backscatter scattering angle in degrees which is a function of the
      #   sensor geometry of the measuring instrument
      theta: 124
      # [xfactor]:
      #   X (Chi) factor which scales the particulate scattering value at a particular backwards angle to
      #   the total particulate backscattering coefficient integrated over all backwards angles.
      xfactor: 1.076
    # [diagnostics]:
    #   Creates a box plot comparing value ranges before and after conversion
    diagnostics: false

# Isolate BBP Spikes (src/pelagos_py/steps/processing/bbp.py -> IsolateBBPSpikes):
# Uses a running median/minmax filter to separate baseline and spike BBP data.
  - name: "Isolate BBP Spikes"
    parameters:
      # [apply_to]:
      #   Name of the variable to apply the correction to.
      apply_to: BBP700
      # [window_size]:
      #   Median/minmax filter window size in sample number
      window_size: 50
      # [method]:
      #   Method used to filter the data to determine the baseline
      method: median
    # [Diagnostics]:
    #   Shows the raw data with smoothed output on top. Extracted spikes are shown below.
    diagnostics: true


# ------------------------------------------------------------------------------------------- Oxygen processing -------------------------------------------------------------------------------------------

# The oxygen processing steps are currently being developed. While you are welcome to use these,
# there is no guarantee that they will produce a useful output. Comments for this section will
# follow once testing is complete.

  - name: "Derive Uncalibrated Phase"
    parameters:
      #  <MANDATORY>
      blue_phase_name: "BPHASE_DOXY"
      # <OPTIONAL>
      # red_phase_name: "RPHASE_DOXY"
    diagnostics: false

  - name: "Derive Optode Temperature"
    parameters:
      temp_voltage_name: "TEMP_VOLTAGE_DOXY"
      calib_coefficients: [0, 1, 0, 0, 0, 0]
    diagnostics: false

  - name: "Phase Pressure Correction"
    parameters:
      optode_pressure_name: "PRES"
      correction_coefficient: 0.1
    diagnostics: false

  - name: "Derive Calibrated Phase"
    parameters:
      uncalibrated_phase_name: "UNCAL_PHASE_DOXY_PCORR"
      calib_coefficients: [0, 1, 0, 0]
    diagnostics: false

  - name: "Derive Oxygen Concentration"
    parameters:
      # <MANDATORY>
      method: "poly"
      # <METHOD DEPENDENT>
      # The following params are for "poly" method
      temperature_name: "CONS_TEMP"
      calib_coefficient_matrix: [
        [0, 1, 0, 0],
        [0, 1, 0, 0],
        [0, 1, 0, 0],
        [0, 1, 0, 0],
        [0, 1, 0, 0]
      ]
    diagnostics: false

  - name: "Molar DOXY Salinity Correction"
    parameters:
      # <MANDATORY>
      salinity_name: "PRAC_SALINITY"
      temperature_name: "CONS_TEMP"
      # <OPTIONAL>
      # reference_salinity: 0
    diagnostics: false

  - name: "Molar DOXY Pressure Correction"
    parameters:
      pressure_name: "PRES"
      temperature_name: "CONS_TEMP"
      molar_doxy_name: "MOLAR_DOXY_PSAL"
      uncalibrated_phase_correction_applied: true
    diagnostics: false

# ------------------------------------------------------------------------------------------- Report assembly -------------------------------------------------------------------------------------------

# Report generation is currently under development (2026-02-12) and is subject to change
# following testing. More detailed documentation and exensive templates will be available
# when fully implemented in a few different workflows.

# Report generation is done using Sphinx, called using the `subprocess` library. This
# may or may not be functional universally on different systems, so other packages may
# be subject to exploration in the near future.

# This step does not currently have diagnostics.

  - name: Write Data Report
    parameters:
      # [title]: string of the title
      #   The title of the report, which will go on the title page
      #   If left blank, it will use the filename core.
      title: "Data Pipeline Report"
      # [fname]: string of the .rst filename
      #   The filename of the main .rst file which will be written to within the pipeline's 
      #   `out_directory`. If left blank, it will use the filename core.
      fname: "data_report.rst"
      # [build]: true/false
      #   Whether to run Sphinx on the .rst at the end and generate the specified PDF
      build: false
      # [extent]: list of lat/lon
      #   This is for use on the geographic extent of the inset figure. Helpful for providing
      #   context to each glider mission, which can vary. Defaults to the Baltic Sea.
      extent: [min_lon max_lon min_lat max_lon]

      ### Below are additional reporting parameters for the future
      # ext_format: pdf   # Something to eventually support - singletext, html
      # overwrite: True   # Delete _build from within the "out_directory", if it exists
      # template: None    # Could define conf.py or report generation orders different from the current base one
      # figures: png      # Add .svg, .pdf support for vector formats
      # method: Sphinx    # if Sphinx is found to be problematic on certain systems, attempt with another system
